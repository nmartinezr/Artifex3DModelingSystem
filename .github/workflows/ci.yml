name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  project-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r packages/project-schema/requirements-dev.txt
      - run: python -m unittest discover -s packages/project-schema/tests -p 'test_*.py'

  geometry-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'services/geometry-engine[dev]'
      - run: ruff check services/geometry-engine/src tests/geometry
      - run: mypy services/geometry-engine/src
      - run: pytest tests/geometry -q
      - run: python tests/geometry/benchmark_trimesh.py

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
